name: Build and publish Docker image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/**'
      - 'src/**'
      - '**/*.php'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/my-php-apache:latest
            ghcr.io/${{ github.repository_owner }}/my-php-apache:${{ github.sha }}
          # optional build-args:
          # build-args: |
          #   PHP_VERSION=8.2

      - name: Output image reference
        run: |
          echo "Image pushed:"
          echo "  ghcr.io/${{ github.repository_owner }}/my-php-apache:latest"
          echo "  ghcr.io/${{ github.repository_owner }}/my-php-apache:${{ github.sha }}"
